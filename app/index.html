<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 iPhone Backup Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2em;
            color: #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            h1 {
                font-size: 2em;
            }
        }

        .status {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9em;
        }

        .status.ready {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.running {
            background: #fff3e0;
            color: #e65100;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .device-selector {
            margin: 15px 0;
        }

        .device-selector label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .device-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .device-info p {
            margin: 8px 0;
            color: #555;
        }

        .device-info strong {
            color: #333;
        }

        .device-info-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .device-info-block {
            flex: 1 1 220px;
            min-width: 200px;
        }

        .pair-record-section {
            margin-top: 0;
        }

        .pair-record-details {
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        .pair-record-details summary {
            font-size: 1em;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            list-style: none;
        }

        .pair-record-details summary::-webkit-details-marker {
            display: none;
        }

        .pair-record-details summary::before {
            content: '▸';
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.2s ease;
        }

        .pair-record-details[open] summary::before {
            transform: rotate(90deg);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin: 20px 0;
        }

        button {
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-stop {
            background: #f44336;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(244, 67, 54, 0.3);
        }

        .btn-clipboard {
            background: #f1f3f5;
            border: 1px solid #dcdfe3;
            color: #444;
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
        }

        .btn-clipboard:hover:not(:disabled) {
            background: #e9ecef;
            color: #222;
            text-decoration: none;
        }

        .logs-section {
            margin-top: 50px;
        }

        .logs-section h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .logs-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 10px;
            height: 350px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .logs-container::-webkit-scrollbar {
            width: 10px;
        }

        .logs-container::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 10px;
        }

        .logs-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }

        .logs-container::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        /* Inline edit affordance */
        .editable {
            border-bottom: 1px dotted transparent;
            cursor: pointer;
            display: inline-block;
            min-width: 120px; /* clickable even when empty */
        }
        .editable:hover { border-bottom-color: #999; }
        /* Enlarge click target when empty */
        .editable:empty::after {
            content: " ";
            display: inline-block;
            width: 100%;
            height: 1.2em;
        }
        .inline-input {
            padding: 4px 6px;
            font-size: 0.95em;
            border: 1px solid #bbb;
            border-radius: 4px;
            min-width: 140px;
        }
        .inline-input.invalid {
            border-color: #e53935;
            background: #ffebee;
        }
        .blink-ok {
            animation: blinkok 0.8s ease;
        }
        @keyframes blinkok { from { background:#e8f5e9; } to { background:transparent; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 iOS Backup</h1>
        </div>

        <div class="device-selector" id="device-selector">
            <label for="device-select">iPhone auswählen:</label>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap;">
                <select id="device-select">
                    <option value="">-- Bitte wählen --</option>
                </select>
            </div>
            
        </div>

        <div id="device-info" class="device-info hidden">
            <div class="device-info-row">
                <div class="device-info-block">
                    <p><strong>Name:</strong> <span id="device-name" class="editable" title="Klicken zum Bearbeiten"></span></p>
                    <p><strong>IP:</strong> <span id="device-ip" class="editable" title="Klicken zum Bearbeiten"></span></p>
                    <p><strong>UUID:</strong> <span id="device-uuid" class="editable" title="Klicken zum Bearbeiten"></span></p>
                    <p><strong>Letztes Backup:</strong> <span id="last-backup-date">–</span></p>
                    <p><strong>Typ:</strong> <span id="product-type">–</span></p>
                    <p><strong>Version:</strong> <span id="product-version">–</span></p>
                </div>

                <div class="device-info-block pair-record-section">
                    
                    <details class="pair-record-details">
                        <summary style="display:flex; align-items:center; gap:10px;">
                            <span>🔑 Pairing Record aktualisieren</span>
                            <button id="btn-delete-device" class="link-btn" title="Gerät löschen" style="margin-left:auto; background:none; border:none; color:#888; padding:0; font-size:14px; cursor:pointer;">🗑️</button>
                        </summary>
                        <div class="pair-actions" style="margin-top:10px; padding-left:22px;">
                            <button id="btn-clipboard" class="btn-clipboard">Inhalt aus Clipboard einfügen</button>
                            <div id="clipboard-message"></div>
                        </div>
                    </details>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button id="btn-start" class="btn-start" disabled>▶️ Start</button>
            <button id="btn-stop" class="btn-stop" disabled>⏹️ Stopp</button>
        </div>

        <div class="logs-section">
            <h2 id="progress-title">📋 Fortschritt</h2>
            <div id="device-info-display" class="hidden" style="margin-bottom: 15px; color: #666; font-size: 0.9em;"></div>
            
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
                <div id="progress-text" class="progress-text">0%</div>
            </div>
            
            <div id="logs" class="logs-container">Keine Logs vorhanden.</div>
        </div>
    </div>

    <script>
        // BASE_URL wird vom Server injiziert
        const BASE_URL = window.BASE_URL || '';

        // State
        let devices = {};
        let selectedDevice = null;
        let isRunning = false;
        let eventSource = null;
        let currentProgress = 0;

        // DOM-Elemente
        const progressTitle = document.getElementById('progress-title');
        const deviceInfoDisplay = document.getElementById('device-info-display');
        const deviceSelector = document.getElementById('device-selector');
        const deviceSelect = document.getElementById('device-select');
        const deviceInfo = document.getElementById('device-info');
        const deviceIP = document.getElementById('device-ip');
        const deviceUUID = document.getElementById('device-uuid');
        const deviceNameSpan = document.getElementById('device-name');
            const btnDeleteDevice = document.getElementById('btn-delete-device');
        const lastBackupDate = document.getElementById('last-backup-date');
        const productType = document.getElementById('product-type');
        const productVersion = document.getElementById('product-version');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnClipboard = document.getElementById('btn-clipboard');
        const clipboardMessage = document.getElementById('clipboard-message');
        const logsEl = document.getElementById('logs');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        

        // API-Calls mit BASE_URL
        async function api(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (data) options.body = JSON.stringify(data);
            
            const response = await fetch(BASE_URL + endpoint, options);
            return response.json();
        }

        // Status laden
        async function loadStatus() {
            const status = await api('/api/status');
            isRunning = status.running;
            
            if (isRunning) {
                progressTitle.textContent = `🟢 Backup läuft: ${status.device}`;
                deviceInfo.classList.add('hidden');
                deviceSelector.classList.add('hidden');
                deviceSelect.disabled = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                
                // Show device info if available
                if (status.device_info) {
                    deviceInfoDisplay.textContent = `${status.device_info.model || ''} • iOS ${status.device_info.version || ''}`;
                    deviceInfoDisplay.classList.remove('hidden');
                } else {
                    deviceInfoDisplay.classList.add('hidden');
                }
                
                // Update progress from status
                if (status.progress !== undefined) {
                    currentProgress = status.progress;
                    progressFill.style.width = status.progress + '%';
                    progressText.textContent = status.progress + '%';
                }
                
                // Server-Sent Events für Live-Updates
                startEventStream();
            } else {
                progressTitle.textContent = '⚪ Bereit';
                deviceInfoDisplay.classList.add('hidden');
                deviceSelect.disabled = false;
                btnStop.disabled = true;
                updateButtons();
                deviceSelector.classList.remove('hidden');
                if (selectedDevice) {
                    deviceInfo.classList.remove('hidden');
                }
                
                // Finale Logs laden
                loadLogs();
            }
        }

        // Devices laden
        async function loadDevices() {
            devices = await api('/api/devices');
            renderDeviceOptions();
            autoDetectDevice();
        }

        function renderDeviceOptions() {
            // Clear existing
            while (deviceSelect.firstChild) deviceSelect.removeChild(deviceSelect.firstChild);
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '-- Bitte wählen --';
            deviceSelect.appendChild(placeholder);
            for (const [name, info] of Object.entries(devices)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                deviceSelect.appendChild(option);
            }
            // Add option to create a new device at the end
            const addOpt = document.createElement('option');
            addOpt.value = '__add__';
            addOpt.textContent = '＋ Gerät hinzufügen…';
            deviceSelect.appendChild(addOpt);
            if (selectedDevice && devices[selectedDevice]) {
                deviceSelect.value = selectedDevice;
            }
        }

        // Inline edit helpers
        function isValidIPv4(value) {
            const parts = value.split('.');
            if (parts.length !== 4) return false;
            return parts.every(p => {
                if (!/^\d{1,3}$/.test(p)) return false;
                const n = Number(p);
                return n >= 0 && n <= 255 && (p.length === 1 || p[0] !== '0' || n === 0);
            });
        }

        function inlineEdit(spanEl, field) {
            if (!selectedDevice) return;
            // Prevent multiple inputs
            if (spanEl.dataset.editing === '1') return;
            spanEl.dataset.editing = '1';

            const initial = spanEl.textContent || '';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'inline-input';
            input.value = initial;
            input.setAttribute('aria-label', field.toUpperCase() + ' bearbeiten');

            const finish = async (commit) => {
                spanEl.dataset.editing = '';
                const newVal = input.value.trim();
                // Restore span
                input.replaceWith(spanEl);
                if (!commit || newVal === initial) return; // no change

                // Optional validation
                if (field === 'ip' && !isValidIPv4(newVal)) {
                    // brief invalid flash
                    spanEl.textContent = initial;
                    spanEl.classList.remove('blink-ok');
                    spanEl.title = 'Ungültige IPv4-Adresse';
                    return;
                }

                try {
                    if (field === 'name') {
                        // Rename device
                        const res = await api('/api/devices', 'POST', { device: selectedDevice, newName: newVal });
                        if (res && !res.error) {
                            // Move entry in devices map
                            const current = devices[selectedDevice] || {};
                            delete devices[selectedDevice];
                            devices[newVal] = current;
                            selectedDevice = newVal;
                            // Update UI
                            spanEl.textContent = newVal;
                            renderDeviceOptions();
                            deviceSelect.value = selectedDevice;
                            // success blink
                            spanEl.classList.add('blink-ok');
                            setTimeout(() => spanEl.classList.remove('blink-ok'), 800);
                        } else {
                            spanEl.textContent = initial;
                            if (res && res.error) alert('Fehler: ' + res.error);
                        }
                    } else {
                        // Update field ip/uuid
                        const payload = { device: selectedDevice };
                        payload[field] = newVal;
                        const res = await api('/api/devices', 'POST', payload);
                        if (res && !res.error) {
                            if (!devices[selectedDevice]) devices[selectedDevice] = {};
                            if (field === 'ip') {
                                devices[selectedDevice].ip = newVal;
                                spanEl.textContent = newVal;
                            } else if (field === 'uuid') {
                                devices[selectedDevice].pair_record = newVal;
                                spanEl.textContent = newVal;
                            }
                            spanEl.classList.add('blink-ok');
                            setTimeout(() => spanEl.classList.remove('blink-ok'), 800);
                        } else {
                            spanEl.textContent = initial;
                            if (res && res.error) alert('Fehler: ' + res.error);
                        }
                    }
                } catch (e) {
                    spanEl.textContent = initial;
                    alert('Fehler: ' + e.message);
                }
            };

            // Replace span with input
            spanEl.replaceWith(input);
            input.focus();
            input.select();

            input.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') {
                    ev.preventDefault();
                    finish(true);
                } else if (ev.key === 'Escape') {
                    ev.preventDefault();
                    finish(false);
                }
            });
            input.addEventListener('blur', () => finish(true));
        }

        // Device automatisch erkennen
        async function autoDetectDevice() {
            try {
                // Client-IP über den Server ermitteln
                const response = await fetch(BASE_URL + '/api/my-ip');
                const data = await response.json();
                const myIp = data.ip;
                
                // Passendes Gerät nach IP finden
                for (const [name, info] of Object.entries(devices)) {
                    if (info.ip === myIp) {
                        deviceSelect.value = name;
                        selectedDevice = name;
                        deviceIP.textContent = info.ip;
                        deviceUUID.textContent = info.pair_record;
                        deviceInfo.classList.remove('hidden');
                        btnStart.disabled = false;
                        await loadBackupInfo(name);
                        return;
                    }
                }
            } catch (error) {
                console.log('Auto-detect fehlgeschlagen:', error);
            }
        }

        // Device-Auswahl
        deviceSelect.addEventListener('change', async (e) => {
            selectedDevice = e.target.value;
            if (selectedDevice === '__add__') {
                // Generate a unique default name
                const base = 'Neues Gerät';
                let newName = base;
                let i = 1;
                while (devices[newName]) { newName = base + ' ' + (++i); }
                try {
                    const res = await api('/api/devices', 'POST', { device: newName });
                    if (res && res.error) {
                        alert('Fehler: ' + res.error);
                        // reset selection
                        deviceSelect.value = '';
                        selectedDevice = null;
                        return;
                    }
                    // Reflect locally and reload devices
                    devices[newName] = { ip: '', pair_record: '' };
                    selectedDevice = newName;
                    renderDeviceOptions();
                    deviceSelect.value = selectedDevice;
                    deviceNameSpan.textContent = selectedDevice;
                    deviceIP.textContent = '';
                    deviceUUID.textContent = '';
                    deviceInfo.classList.remove('hidden');
                    btnStart.disabled = false;
                    return; // handled
                } catch (err) {
                    alert('Fehler beim Hinzufügen: ' + err.message);
                    deviceSelect.value = '';
                    selectedDevice = null;
                    return;
                }
            }
            
            if (selectedDevice) {
                const device = devices[selectedDevice];
                deviceNameSpan.textContent = selectedDevice;
                    deviceIP.textContent = device.ip || '';
                    deviceUUID.textContent = device.pair_record || '';
                deviceInfo.classList.remove('hidden');
                btnStart.disabled = false;
                loadBackupInfo(selectedDevice);
            } else {
                deviceInfo.classList.add('hidden');
                btnStart.disabled = true;
            }
            
        });

        // Activate inline edit on click
        deviceNameSpan.addEventListener('click', () => inlineEdit(deviceNameSpan, 'name'));
        deviceIP.addEventListener('click', () => inlineEdit(deviceIP, 'ip'));
        deviceUUID.addEventListener('click', () => inlineEdit(deviceUUID, 'uuid'));

            // Delete device (prevent toggling the details)
            btnDeleteDevice.addEventListener('click', async (ev) => {
                ev.stopPropagation();
                if (!selectedDevice) return;
                const confirmText = `Gerät "${selectedDevice}" wirklich löschen?\nDies entfernt auch die gespeicherte Pair-Record-Datei (falls vorhanden).`;
                if (!confirm(confirmText)) return;
                try {
                    const res = await api('/api/devices/delete', 'POST', { device: selectedDevice });
                    if (res && !res.error) {
                        // Update local state
                        delete devices[selectedDevice];
                        selectedDevice = null;
                        renderDeviceOptions();
                        deviceSelect.value = '';
                        deviceInfo.classList.add('hidden');
                        btnStart.disabled = true;
                    } else {
                        alert('Fehler: ' + (res && res.error ? res.error : 'Unbekannt'));
                    }
                } catch (e) {
                    alert('Fehler beim Löschen: ' + e.message);
                }
            });

        

        async function loadBackupInfo(deviceName) {
            try {
                const response = await fetch(`${BASE_URL}/api/backup-info?device=${encodeURIComponent(deviceName)}`);
                const data = await response.json();
                const info = data.info;
                if (info) {
                    lastBackupDate.textContent = info.last_backup_date || '–';
                    productType.textContent = info.product_type || '–';
                    productVersion.textContent = info.product_version || '–';
                } else {
                    lastBackupDate.textContent = '–';
                    productType.textContent = '–';
                    productVersion.textContent = '–';
                }
            } catch (error) {
                lastBackupDate.textContent = '–';
                productType.textContent = '–';
                productVersion.textContent = '–';
            }
        }

        // Backup starten
        btnStart.addEventListener('click', async () => {
            if (!selectedDevice) return;
            
            try {
                currentProgress = 0;
                updateProgress(0); // UI auch zurücksetzen
                logsEl.textContent = 'Keine Logs vorhanden.';
                await api('/api/start', 'POST', { device: selectedDevice });
                await loadStatus();
            } catch (error) {
                alert('Fehler beim Starten: ' + error.message);
            }
        });

        // Backup stoppen
        btnStop.addEventListener('click', async () => {
            try {
                await api('/api/stop', 'POST');
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                await loadStatus();
            } catch (error) {
                alert('Fehler beim Stoppen: ' + error.message);
            }
        });

        // Clipboard-Button
        btnClipboard.addEventListener('click', async () => {
            try {
                const content = await navigator.clipboard.readText();
                
                if (!content) {
                    showClipboardMessage('Clipboard ist leer', 'error');
                    return;
                }
                
                const result = await api('/api/update-pair-record', 'POST', {
                    device: selectedDevice,
                    content: content
                });
                
                if (result.success) {
                    showClipboardMessage('✅ Pairing Record aktualisiert', 'success');
                } else {
                    showClipboardMessage('❌ Fehler: ' + result.error, 'error');
                }
            } catch (error) {
                showClipboardMessage('❌ Clipboard-Zugriff verweigert (HTTPS nötig)', 'error');
            }
        });

        // Clipboard-Nachricht anzeigen
        function showClipboardMessage(message, type) {
            clipboardMessage.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                clipboardMessage.innerHTML = '';
            }, 5000);
        }

        // Logs laden
        async function loadLogs() {
            try {
                const data = await api('/api/logs');
                logsEl.textContent = data.logs || 'Keine Logs vorhanden.';
                updateProgress(data.progress);
                
                // Auto-scroll
                logsEl.scrollTop = logsEl.scrollHeight;
            } catch (error) {
                console.error('Fehler beim Laden der Logs:', error);
            }
        }

        // Server-Sent Events für Live-Updates
        function startEventStream() {
            if (eventSource) eventSource.close();
            
            eventSource = new EventSource(BASE_URL + '/api/stream');
            
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.done) {
                    eventSource.close();
                    eventSource = null;
                    loadStatus();
                    return;
                }
                
                if (data.logs) {
                    logsEl.textContent += data.logs;
                    logsEl.scrollTop = logsEl.scrollHeight;
                }
            };
            
            eventSource.onerror = () => {
                eventSource.close();
                eventSource = null;
                loadStatus();
            };
        }

        // Fortschritt aktualisieren
        function updateProgress(percent) {
            if (percent > currentProgress) {
                currentProgress = percent;
                progressFill.style.width = percent + '%';
                progressText.textContent = percent + '%';
            }
        }

        // Buttons aktualisieren
        function updateButtons() {
            if (isRunning) {
                btnStart.disabled = true;
                btnStop.disabled = false;
            } else {
                btnStart.disabled = !selectedDevice;
                btnStop.disabled = true;
            }
        }

        // Polling für Logs (wenn nicht running)
        setInterval(() => {
            if (!isRunning && selectedDevice) {
                loadLogs();
            }
        }, 2000);

        // Polling für Status
        setInterval(loadStatus, 3000);

        // Polling für Progress während Backup läuft
        setInterval(async () => {
            if (isRunning) {
                const status = await api('/api/status');
                if (status.progress !== undefined) {
                    updateProgress(status.progress);
                }
            }
        }, 1000);

        // Init
        loadDevices();
        loadStatus();
    </script>
</body>
</html>
